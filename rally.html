<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rally AR — Drive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0e1a; overflow: hidden; font-family: 'Inter','Segoe UI',sans-serif; }
        canvas { display: block; width: 100%; height: 100vh; }
        #loading {
            position: fixed; inset: 0; z-index: 999;
            background: #0a0e1a;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }
        #loading h1 { color: #e2e8f0; font-size: 28px; font-weight: 900; letter-spacing: 2px; }
        #loading p { color: #64748b; font-size: 13px; margin-top: 8px; }
        .spinner { width: 40px; height: 40px; border: 3px solid #334155; border-top-color: #dc2626;
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #back-btn {
            position: fixed; top: 16px; left: 16px; z-index: 100;
            background: rgba(15,23,42,0.85); color: #94a3b8; border: 1px solid #334155;
            padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 700;
            cursor: pointer; backdrop-filter: blur(8px); transition: all 0.2s;
        }
        #back-btn:hover { color: #fff; border-color: #dc2626; }
        #no-terrain {
            position: fixed; inset: 0; z-index: 998;
            background: rgba(10,14,26,0.95);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 16px;
        }
        #no-terrain h2 { color: #e2e8f0; font-size: 22px; font-weight: 800; }
        #no-terrain p { color: #94a3b8; font-size: 13px; max-width: 300px; text-align: center; }
        #no-terrain a {
            background: #dc2626; color: #fff; text-decoration: none;
            padding: 12px 28px; border-radius: 10px; font-weight: 800; font-size: 14px;
        }
    </style>
</head>
<body>

<div id="loading">
    <div class="spinner"></div>
    <h1>RALLY AR</h1>
    <p>Loading terrain...</p>
</div>

<div id="no-terrain">
    <h2>🏗️ No Track Found</h2>
    <p>Build a track first in the terrain editor, then come back to drive on it.</p>
    <a href="arcade.html?autorun=edit_build">→ Open Builder</a>
</div>

<button id="back-btn" onclick="window.location.href='rally_hub.html'">← Hub</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="arcade-auth.js"></script>
<script src="arcade-api-service.js"></script>
<script src="arcade-storage-service.js"></script>
<script src="rally-surfaces.js"></script>
<script src="rally-damage.js"></script>
<script src="rally-camera.js"></script>
<script src="rally-respawn.js"></script>
<script src="rally-vehicle.js"></script>
<script src="helicopter-vehicle.js"></script>  <!-- Helicopter physics -->
<script src="terrain-shader-utils.js"></script>    <!-- PHASE 2 — procedural textures -->
<script src="terrain-shader-material.js"></script> <!-- PHASE 2 — GLSL + ShaderMaterial -->
<script src="terrain-shader-geo.js"></script>       <!-- PHASE 2 — splat map, vertex colors -->
<script src="road-decal.js"></script>              <!-- Road gravel overlay meshes -->

<script>
(function() {
    'use strict';

    const TERRAIN_SIZE = 900;
    // FIX D6: mobile detection — match arcade.html line 2662-2663
    const _isMobile = /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent);
    const TERRAIN_SEGS = _isMobile ? 400 : 600;
    window.TERRAIN_SIZE = TERRAIN_SIZE;
    window.TERRAIN_SEGS = TERRAIN_SEGS;

    // ── Scene Setup ──
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 400, 900);
    window.scene = scene;

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 3000);
    camera.position.set(0, 30, 50);
    window.camera = camera;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI / 2.1;

    // Lighting
    const ambLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambLight);
    const dLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dLight.position.set(200, 500, 100);
    dLight.castShadow = true;
    dLight.shadow.camera.left = -100;
    dLight.shadow.camera.right = 100;
    dLight.shadow.camera.top = 100;
    dLight.shadow.camera.bottom = -100;
    dLight.shadow.camera.near = 0.5;
    dLight.shadow.camera.far = 1000;
    dLight.shadow.mapSize.width = 2048;
    dLight.shadow.mapSize.height = 2048;
    scene.add(dLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    
    // VISUELL HJÄLP: Ett gigantiskt rutnät för att se att världen faktiskt roterar
    // Eftersom himlen och gräset är solida färger blir det en synvilla annars.
    const gridHelper = new THREE.GridHelper(900, 100, 0x000000, 0x000000);
    gridHelper.position.y = 0.1; // Strax över marknivå
    gridHelper.material.opacity = 0.2;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // ── Terrain ──
    const planeGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEGS, TERRAIN_SEGS);
    // PHASE 2 — ShaderMaterial (replaces MeshLambertMaterial)
    // splatTex starts null — rebuilt in img.onload after biome PNG loads
    window.terrainShaderGeo.initVertexColors(planeGeo);
    const _rallyTextures = window.terrainShaderUtils.generatePlaceholderTextures();
    const planeMat = window.terrainShaderMaterial.buildTerrainMaterial(_rallyTextures, {
        fogNear: 400, fogFar: 900, terrainMaxHeight: 120,
        fogColor: 0x87ceeb,
    });
    planeMat.uniforms.u_playMode.value = 1.0; // Always PLAY mode — OB hidden
    const terrainMesh = new THREE.Mesh(planeGeo, planeMat);
    terrainMesh.rotation.x = -Math.PI / 2;
    terrainMesh.receiveShadow = true;
    scene.add(terrainMesh);
    window._terrainMat = planeMat;


    // ── Biome color → surface type classifier ──
    // Matches pixel RGB to nearest golf biome (then rally-surfaces.js maps to rally type)
    const BIOME_COLORS = [
        { r:0x98, g:0xce, b:0x68, type:'GREEN' },
        { r:0x7c, g:0xb5, b:0x4c, type:'TEE' },
        { r:0x8b, g:0xc4, b:0x5d, type:'FOREGREEN' },
        { r:0x7d, g:0xb9, b:0x52, type:'FAIRWAY' },
        { r:0x6b, g:0x9e, b:0x3d, type:'SEMI-ROUGH' },
        { r:0x4a, g:0x78, b:0x2b, type:'ROUGH' },
        { r:0x2d, g:0x4c, b:0x1a, type:'FESCUE' },
        { r:0xe0, g:0xd8, b:0xa4, type:'SAND' },
        { r:0xc2, g:0xaf, b:0x7c, type:'WASTE' },
        { r:0xef, g:0x44, b:0x44, type:'OB' },
        { r:0x38, g:0xbd, b:0xf8, type:'WATER' },
        
        // Rally Palette Colors mapped to correct Physics/Shader strings
        { r:0x64, g:0x74, b:0x8b, type:'ROUGH' },     // Klippa -> Grass/Dirt
        { r:0x9c, g:0xa3, b:0xaf, type:'WASTE' },     // Grus -> Gravel/Gravel
        { r:0x71, g:0x3f, b:0x12, type:'SEMI-ROUGH'}, // Jord -> Gravel/Gravel
        { r:0x45, g:0x1a, b:0x03, type:'FESCUE' },    // Lera -> Mud/Mud
        { r:0x14, g:0x53, b:0x2d, type:'DEEP ROUGH'}, // Tät Skog -> Mud/Mud
        { r:0xd4, g:0xb4, b:0x83, type:'SAND' },      // Öken/Sand -> Dirt/Dirt
        { r:0x84, g:0xcc, b:0x16, type:'ROUGH' },     // Ljus Gräs -> Grass/Dirt
        { r:0x1e, g:0x29, b:0x3b, type:'FAIRWAY' }    // Asfalt -> Tarmac/Asphalt
    ];
    function classifyBiomeColor(r, g, b) {
        let best = 'ROUGH', bestDist = Infinity;
        for (let bc of BIOME_COLORS) {
            let dr = r-bc.r, dg = g-bc.g, db = b-bc.b;
            let d = dr*dr + dg*dg + db*db;
            if (d < bestDist) { bestDist = d; best = bc.type; }
        }
        return best;
    }

    // ── localGetTerrainAt (needed by rally-vehicle.js) ──
    window.localGetTerrainAt = function(px, py) {
        let threeX = px;
        let threeZ = -py;
        let step = TERRAIN_SIZE / TERRAIN_SEGS;
        let positions = planeGeo.attributes.position.array;

        let gx = Math.round((threeX + TERRAIN_SIZE / 2) / step);
        let gz = Math.round((threeZ + TERRAIN_SIZE / 2) / step);
        gx = Math.max(0, Math.min(TERRAIN_SEGS, gx));
        gz = Math.max(0, Math.min(TERRAIN_SEGS, gz));

        let idx = gz * (TERRAIN_SEGS + 1) + gx;
        let height = positions[idx * 3 + 2];

        // Normal calculation
        let gxR = Math.min(TERRAIN_SEGS, gx + 1);
        let gzD = Math.max(0, gz - 1);
        let hR = positions[(gz * (TERRAIN_SEGS + 1) + gxR) * 3 + 2];
        let hD = positions[(gzD * (TERRAIN_SEGS + 1) + gx) * 3 + 2];
        let dx = (hR - height) / step;
        let dy = (hD - height) / step;
        let len = Math.sqrt(dx * dx + dy * dy + 1.0);

        // Biome detection from color data (if available)
        let surfType = 'FAIRWAY';
        if (window._biomeCanvas) {
            let bx = Math.round((threeX + TERRAIN_SIZE/2) / TERRAIN_SIZE * window._biomeCanvas.width);
            let by = Math.round((threeZ + TERRAIN_SIZE/2) / TERRAIN_SIZE * window._biomeCanvas.height);
            bx = Math.max(0, Math.min(window._biomeCanvas.width-1, bx));
            by = Math.max(0, Math.min(window._biomeCanvas.height-1, by));
            // ROAD SYSTEM — use cached pixel array instead of getImageData per call
            if (window._biomePixels && window._biomeWidth) {
                let idx = (by * window._biomeWidth + bx) * 4;
                surfType = classifyBiomeColor(window._biomePixels[idx], window._biomePixels[idx+1], window._biomePixels[idx+2]);
            } else if (window._biomeCtx) {
                // Fallback: getImageData (slow, only before _biomePixels is ready)
                let px = window._biomeCtx.getImageData(bx, by, 1, 1).data;
                surfType = classifyBiomeColor(px[0], px[1], px[2]);
            }
        }
        return {
            z: height,
            normal: [-dx / len, dy / len, 1.0 / len],
            type: surfType
        };
    };

    // ── ROAD PIPELINE FIX: getTerrainHeight adapter for road-decal.js ──
    // road-decal.js expects getTerrainHeight(worldX, worldZ) → scalar height.
    // Wraps localGetTerrainAt which takes (worldX, -worldZ) → {z: height}.
    window.getTerrainHeight = function(worldX, worldZ) {
        let t = window.localGetTerrainAt(worldX, -worldZ);
        return (t && typeof t.z === 'number') ? t.z : 0;
    };

    // ── Bilinear heightmap resampler (inline — not shared with arcade.html) ──
    // Validates input strictly: throws if segs <= 0 or arr is unusably short.
    function resampleHeightmap(srcArr, srcSegs, dstSegs) {
        if (!srcArr || srcSegs <= 0 || dstSegs <= 0) throw new Error('resampleHeightmap: invalid args segs=' + srcSegs + '/' + dstSegs);
        let srcStride = srcSegs + 1, dstStride = dstSegs + 1;
        let expectedSrc = srcStride * srcStride;
        if (srcArr.length < expectedSrc) throw new Error('resampleHeightmap: src too short ' + srcArr.length + ' < ' + expectedSrc);
        let result = new Float32Array(dstStride * dstStride);
        for (let dz = 0; dz < dstStride; dz++) {
            for (let dx = 0; dx < dstStride; dx++) {
                let sx = (dx / dstSegs) * srcSegs, sz = (dz / dstSegs) * srcSegs;
                let x0 = Math.floor(sx), x1 = Math.min(x0 + 1, srcSegs);
                let z0 = Math.floor(sz), z1 = Math.min(z0 + 1, srcSegs);
                let fx = sx - x0, fz = sz - z0;
                let h00 = isFinite(srcArr[z0 * srcStride + x0]) ? srcArr[z0 * srcStride + x0] : 0;
                let h10 = isFinite(srcArr[z0 * srcStride + x1]) ? srcArr[z0 * srcStride + x1] : 0;
                let h01 = isFinite(srcArr[z1 * srcStride + x0]) ? srcArr[z1 * srcStride + x0] : 0;
                let h11 = isFinite(srcArr[z1 * srcStride + x1]) ? srcArr[z1 * srcStride + x1] : 0;
                result[dz * dstStride + dx] = h00*(1-fx)*(1-fz) + h10*fx*(1-fz) + h01*(1-fx)*fz + h11*fx*fz;
            }
        }
        return result;
    }

    // ── Fynd 1: infer segment count from array length (as arcade.html builder does) ──
    // Returns inferred segs if length is a perfect square with sqrt-1 > 0, else null.
    function inferSegsFromLength(length) {
        if (!length || length <= 0) return null;
        let sq = Math.round(Math.sqrt(length));
        if (sq * sq !== length) return null; // not a perfect square
        let segs = sq - 1;
        return segs > 0 ? segs : null;
    }

    // ── Apply validated heightmap array to terrain geometry ──
    // Returns true on success, throws on invalid input (caller decides fallback).
    function applyHeightArray(arr, segs) {
        if (!arr || arr.length === 0) throw new Error('applyHeightArray: empty array');
        let source = arr;
        if (segs && segs !== TERRAIN_SEGS) {
            console.warn('Resampling heightmap:', segs, '→', TERRAIN_SEGS);
            source = resampleHeightmap(arr, segs, TERRAIN_SEGS); // throws on bad input
        } else {
            // Fynd 2: validate length even when no resampling occurs.
            // Infer expected vertex count from TERRAIN_SEGS or from sqrt of array length.
            let expectedCount = (TERRAIN_SEGS + 1) * (TERRAIN_SEGS + 1);
            if (source.length < expectedCount) {
                // Tolerate arrays that are larger (legacy formats may pad) but not shorter.
                throw new Error('applyHeightArray: array too short: ' + source.length + ' < ' + expectedCount + ' (TERRAIN_SEGS=' + TERRAIN_SEGS + ')');
            }
        }
        let positions = planeGeo.attributes.position.array;
        let applied = Math.min(source.length, planeGeo.attributes.position.count);
        for (let i = 0; i < applied; i++) {
            positions[i * 3 + 2] = isFinite(source[i]) ? source[i] : 0;
        }
        planeGeo.attributes.position.needsUpdate = true;
        planeGeo.computeVertexNormals();
        planeGeo.computeBoundingBox();
        return true;
    }

    // ── Unified heightmap dispatcher ──
    // Decodes any supported heightmap format and calls applyHeightArray.
    // Returns true on success, false on any decode/apply failure.
    // snapSegs: segment count from snapshot metadata (may be undefined).
    function applyTerrainHeightmap(hm, snapSegs) {
        try {
            if (Array.isArray(hm)) {
                // Already-parsed array — Fynd 1: infer segs if not provided
                let segs = snapSegs || inferSegsFromLength(hm.length);
                return applyHeightArray(hm, segs);

            } else if (typeof hm === 'object' && hm !== null && Array.isArray(hm.ground)) {
                // Cloud format: { ground: [...], segs: N }
                // Fynd 1: infer segs from ground length if hm.segs missing
                let segs = hm.segs || snapSegs || inferSegsFromLength(hm.ground.length);
                return applyHeightArray(hm.ground, segs);

            } else if (typeof hm === 'string') {
                // Fynd 3: trim ALL strings once before any format detection
                // (H16 and JSON must both tolerate leading whitespace)
                let s = hm.trimStart();

                if (s.startsWith('H16|')) {
                    // Compressed 16-bit format — requires pako
                    if (typeof pako === 'undefined') {
                        console.error('H16 decode failed: pako not loaded (CDN failure?)');
                        return false;
                    }
                    let b64 = s.substring(4);
                    let binary = atob(b64);
                    let bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    let inflated = pako.inflate(bytes);
                    if (inflated.byteLength % 2 !== 0)
                        throw new Error('H16: inflated byteLength is odd (' + inflated.byteLength + ')');
                    let exact = inflated.buffer.slice(inflated.byteOffset, inflated.byteOffset + inflated.byteLength);
                    let int16 = new Int16Array(exact);
                    let segs = snapSegs || TERRAIN_SEGS;
                    let expectedCount = (segs + 1) * (segs + 1);
                    if (int16.length !== expectedCount)
                        throw new Error('H16: length mismatch — expected ' + expectedCount + ', got ' + int16.length + ' (segs=' + segs + ')');
                    let floatSrc = new Float32Array(int16.length);
                    for (let i = 0; i < int16.length; i++) floatSrc[i] = int16[i] / 100;
                    return applyHeightArray(floatSrc, segs);

                } else if (s.startsWith('{') || s.startsWith('[')) {
                    // JSON string (cloud format)
                    let parsed = JSON.parse(s);
                    // Fynd 1: infer segs when absent
                    let groundArr = Array.isArray(parsed) ? parsed : (parsed.ground || []);
                    let segs = Array.isArray(parsed) ? (snapSegs || inferSegsFromLength(groundArr.length))
                                                     : (parsed.segs || snapSegs || inferSegsFromLength(groundArr.length));
                    return applyHeightArray(groundArr, segs);

                } else {
                    // Legacy base64 float array
                    // Fynd 1: infer segs from resulting float array length
                    let binary = atob(s);
                    let bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    let floatArr = new Float32Array(bytes.buffer);
                    let segs = snapSegs || inferSegsFromLength(floatArr.length);
                    return applyHeightArray(floatArr, segs);
                }
            } else {
                console.warn('applyTerrainHeightmap: unrecognised heightmap format', typeof hm);
                return false;
            }
        } catch (e) {
            console.error('applyTerrainHeightmap failed:', e.message);
            return false;
        }
    }

    // ── Load Terrain Data ──
    // Returns:  true  — at least one data source found; rally may start (may be flat)
    //           false — no playable source found; no-terrain UI shown
    // window._terrainHeightSourceLabel: set to label of source that applied heightmap.
    // resolveSpawnPosition() reads this to align tee data with the same session.
    function loadTerrain() {
        // PERF FIX: lazy-load sources — only parse fallbacks if snapshot fails
        // Old code: parsed ALL 3 localStorage keys eagerly (~10MB JSON on startup)
        // New code: tries snapshot first, only parses custom/compressed if needed
        let snap = ArcadeStorage.loadTerrainSnapshot();

        // Source selection (priority order):
        // 1. Terrain snapshot — H16 from saveLevel(); most reliable for sculpted terrain
        // 2. Custom level    — saveLevel() writes here; freshest builder save
        // 3. Compressed level — arcade_custom_level_z; only written on URL-share import
        let sources = [];
        if (snap && snap.terrain_heightmap) {
            sources.push({ data: snap, label: 'snapshot', segs: snap.segs });
        } else {
            // Snapshot unusable — load fallback sources
            if (snap && !snap.terrain_heightmap) {
                console.warn('Snapshot present but missing terrain_heightmap — loading fallbacks');
            }
            let custom = ArcadeStorage.loadCustomLevel();
            if (custom) sources.push({ data: custom, label: 'custom', segs: null });
            let compressed = ArcadeStorage.loadCompressedLevel();
            if (compressed) sources.push({ data: compressed, label: 'compressed', segs: compressed.segs });
        }

        if (sources.length === 0) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('no-terrain').style.display = 'flex';
            return false;
        }


        // Fynd 2: track which source applied the heightmap and expose it globally.
        // resolveSpawnPosition() can read window._terrainHeightSourceLabel to pick
        // holes from the same source, preventing terrain/tee mismatch.
        let appliedSource = null;
        window._terrainHeightSourceLabel = null;
        for (let src of sources) {
            if (!src.data.terrain_heightmap) continue;
            let ok = applyTerrainHeightmap(src.data.terrain_heightmap, src.segs);
            if (ok) {
                console.log('✅ Terrain heightmap loaded from', src.label);
                if (src.label !== 'snapshot' && snap) {
                    console.warn('Snapshot heightmap unusable — clearing stale snapshot');
                    ArcadeStorage.clearTerrainSnapshot();
                }
                appliedSource = src.data;
                window._terrainHeightSourceLabel = src.label;
                break;
            } else {
                console.warn('Heightmap source "' + src.label + '" failed — trying next source');
                if (src.label === 'snapshot') ArcadeStorage.clearTerrainSnapshot();
            }
        }

        if (!appliedSource) {
            console.warn('⚠️ No sculpted terrain found — driving on flat default');
        }

        // Fynd 4: only load biome from appliedSource (heightmap + biome same data).
        // If no heightmap was applied, skip biome entirely — surface-type data from
        // a mismatched snapshot would give wrong friction/damage on flat terrain.
        let biomeSource = appliedSource; // null = no biome if no heightmap applied
        if (!biomeSource && snap && snap.terrain_biomemap) {
            // Graceful fallback: snapshot has biome but its heightmap failed.
            // Log clearly so this is distinguishable from a real match.
            console.warn('⚠️ Using biome from snapshot without matching heightmap (surface-only fallback)');
            biomeSource = snap;
        }
        if (biomeSource && biomeSource.terrain_biomemap) {
            let img = new Image();
            img.onload = function() {
                let c = document.createElement('canvas');
                c.width = img.width; c.height = img.height;
                let ctx = c.getContext('2d');
                ctx.drawImage(img, 0, 0);
                window._biomeCanvas = c;
                window._biomeCtx = ctx;
                // ROAD SYSTEM — cache biome pixels for fast per-frame lookup
                window._biomePixels = ctx.getImageData(0, 0, c.width, c.height).data;
                window._biomeWidth = c.width;
                // PHASE 2 — build splat map from biome canvas and update ShaderMaterial
                if (window.terrainShaderGeo && window._terrainMat) {
                    const splatTex = window.terrainShaderGeo.buildSplatMap(c, classifyBiomeColor);
                    window._terrainMat.uniforms.u_splat.value = splatTex;
                }
                
                // ── ROAD PIPELINE FIX: rebuild roads from saved data ──
                // Reconstructs vertex colors (R-channel road mask) and 3D decal meshes
                // so roads render with full PBR quality in race mode.
                if (window.raceConfig && window.raceConfig.roads && window.raceConfig.roads.length > 0) {
                    let roads = window.raceConfig.roads;
                    // Rebuild sampledPoints from saved nodes (nodes were serialized, sampledPoints were not)
                    for (let ri = 0; ri < roads.length; ri++) {
                        let road = roads[ri];
                        if (!road.nodes || road.nodes.length < 2) continue;
                        let pts3 = road.nodes.map(function(n) {
                            return new THREE.Vector3(n.worldX, n.worldY, n.worldZ);
                        });
                        let isClosed = !!road.closed;
                        let curve = new THREE.CatmullRomCurve3(pts3, isClosed, 'centripetal');
                        let len = curve.getLength();
                        let sampleCount = Math.max(2, Math.ceil(len / 2.0));
                        let sampled = [];
                        for (let si = 0; si <= sampleCount; si++) {
                            let t = si / sampleCount;
                            let pos = curve.getPoint(t);
                            // Conform Y to loaded terrain
                            if (typeof window.localGetTerrainAt === 'function') {
                                let th = window.localGetTerrainAt(pos.x, -pos.z);
                                if (th && typeof th.z === 'number' && isFinite(th.z)) pos.y = th.z + 0.04;
                            }
                            sampled.push(pos);
                        }
                        road.sampledPoints = sampled;
                    }
                    // Bake vertex color R-channel (road mask) for shader road blending
                    if (window.terrainShaderGeo) {
                        window.terrainShaderGeo.bakeRoadVertexColors(roads, planeGeo, TERRAIN_SIZE);
                    }
                    // Build road decal overlay meshes (photo-textured gravel/cobblestone)
                    if (window.roadDecal) {
                        window.roadDecal.rebuildAll(roads, scene);
                        window.roadDecal.syncFog(scene);
                    }
                    console.log('🛣️ Roads loaded: ' + roads.length + ' road(s) with vertex colors + decals');
                }

                // ── TREE PIPELINE FIX: render saved trees as procedural InstancedMesh ──
                if (window._savedTrees && window._savedTrees.length > 0) {
                    let trees = window._savedTrees;
                    let trunkGeo = new THREE.CylinderGeometry(0.15, 0.25, 1, 6);
                    let canopyGeo = new THREE.ConeGeometry(1, 1, 7);
                    let trunkMat = new THREE.MeshLambertMaterial({ color: 0x5c4033 });
                    let canopyMat = new THREE.MeshLambertMaterial({ color: 0x2d6b22 });
                    
                    let imTrunk = new THREE.InstancedMesh(trunkGeo, trunkMat, trees.length);
                    let imCanopy = new THREE.InstancedMesh(canopyGeo, canopyMat, trees.length);
                    imTrunk.castShadow = true;
                    imCanopy.castShadow = true;
                    let dummy = new THREE.Object3D();
                    let placed = 0;
                    
                    for (let i = 0; i < trees.length; i++) {
                        let t = trees[i];
                        let s = t.s || 1;
                        let gy = 0;
                        if (typeof window.getTerrainHeight === 'function') {
                            gy = window.getTerrainHeight(t.x, t.z);
                        }
                        let trunkH = 3.5 * s;
                        let canopyH = 6.0 * s;
                        let canopyR = 3.0 * s;
                        
                        // Trunk
                        dummy.position.set(t.x, gy + trunkH / 2, t.z);
                        dummy.scale.set(s, trunkH, s);
                        dummy.rotation.set(0, t.r || 0, 0);
                        dummy.updateMatrix();
                        imTrunk.setMatrixAt(placed, dummy.matrix);
                        
                        // Canopy — color from saved data or default
                        let col = new THREE.Color(t.c || 0x2d6b22);
                        imCanopy.setColorAt(placed, col);
                        
                        dummy.position.set(t.x, gy + trunkH + canopyH / 2 - 0.5, t.z);
                        dummy.scale.set(canopyR, canopyH, canopyR);
                        dummy.updateMatrix();
                        imCanopy.setMatrixAt(placed, dummy.matrix);
                        placed++;
                    }
                    
                    imTrunk.count = placed;
                    imCanopy.count = placed;
                    imCanopy.instanceColor.needsUpdate = true;
                    scene.add(imTrunk);
                    scene.add(imCanopy);
                    console.log('🌲 Trees loaded: ' + placed + ' procedural trees');
                }

                // Fallback till "Cartoon-Mode" om spelaren stängt av PBR
                if (window.raceConfig && window.raceConfig.usePbr === false) {
                    let tex = new THREE.CanvasTexture(c);
                    tex.colorSpace = THREE.SRGBColorSpace;
                    let basicMat = new THREE.MeshLambertMaterial({ map: tex, vertexColors: false });
                    if (terrainMesh) {
                        terrainMesh.material = basicMat;
                        window._terrainMat = basicMat;
                    }
                }
                console.log('✅ Biome texture loaded from', window._terrainHeightSourceLabel || 'snapshot-fallback');
                window._terrainReady = true; // Signal: biome + roads + trees all loaded
            };
            img.src = biomeSource.terrain_biomemap;
        } else {
            // No biome source — terrain is ready immediately (flat/heightmap only)
            window._terrainReady = true;
        }

        return sources.length > 0; // true = rally may start; false = nothing found
    }


    // ── Resolve spawn position from saved level data ──
    // Rally mode: reads raceConfig.start
    // Golf fallback: reads holes[0].tees.yellow
    function resolveSpawnPosition() {
        let level = ArcadeStorage.loadCustomLevel() || ArcadeStorage.loadCompressedLevel();
        if (!level) return null;
        
        // TREE PIPELINE FIX: store tree data for rendering after terrain loads
        if (level.trees && Array.isArray(level.trees) && level.trees.length > 0) {
            window._savedTrees = level.trees;
        }
        
        // STORAGE FIX: detect snapshot/config mismatch via saveId
        let snap = ArcadeStorage.loadTerrainSnapshot();
        if (snap && snap._saveId && level._saveId && snap._saveId !== level._saveId) {
            console.warn('⚠️ Terrain snapshot (_saveId=' + snap._saveId + ') does not match level config (_saveId=' + level._saveId + '). Terrain and race config may be from different save sessions.');
        }
        
        // RALLY: read start position + load full race config
        if (level.rally && level.rally.start) {
            window.raceConfig = level.rally;
            let s = level.rally.start;
            console.log('🏎️ Spawn from RALLY START:', s);
            return new THREE.Vector3(s.x || 0, (s.y || 2) + 0.5, s.z || 0);
        }
        
        // GOLF fallback (backward compatibility)
        let holes = level.holes || level.h;
        if (!holes || !holes.length) return null;
        let tees = holes[0].tees || holes[0].t;
        if (!tees) return null;
        let t = tees.yellow || tees.red || tees.white || tees.black;
        if (!t) return null;
        console.log('🏎️ Spawn from tee:', t);
        return new THREE.Vector3(t.x || 0, (t.y || 2) + 0.5, t.z || 0);
    }


    // ── Initialize ──
    let terrainLoaded = loadTerrain();
    let spawnPos = resolveSpawnPosition(); // may be null

    if (terrainLoaded) {
        // TIMING FIX: wait for biome img.onload (roads + trees) before spawning car
        // Polls every 100ms instead of blind 500ms timeout
        let _startAttempts = 0;
        function waitForTerrainAndStart() {
            _startAttempts++;
            if (window._terrainReady || _startAttempts > 50) { // max 5 sec fallback
                if (!window._terrainReady) console.warn('⚠️ Terrain not fully ready — starting anyway (timeout)');
                
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').style.display = 'none', 500);

                // Activate rally vehicle
                controls.enabled = false;
                window.rallyVehicle.activate(scene, camera, controls);

                // Override spawn to saved start position
                if (spawnPos && window.rallyVehicle.getCar) {
                    let car = window.rallyVehicle.getCar();
                    if (typeof window.localGetTerrainAt === 'function') {
                        let t = window.localGetTerrainAt(spawnPos.x, -spawnPos.z);
                        spawnPos.y = t.z + 0.35 + 1.5;
                    }
                    car.position.copy(spawnPos);
                    car._spawnPosition = spawnPos.clone();
                    car._spawnGroundY  = spawnPos.y - 1.5;
                    if (car.mesh) car.mesh.position.copy(spawnPos);
                    let currentLevel = ArcadeStorage.loadCustomLevel() || ArcadeStorage.loadCompressedLevel();
                    if (currentLevel && currentLevel.rally && currentLevel.rally.start && currentLevel.rally.start.rotation !== undefined) {
                        car.heading = currentLevel.rally.start.rotation;
                    } else if (currentLevel && currentLevel.holes && currentLevel.holes[0] && currentLevel.holes[0].tees && currentLevel.holes[0].tees.yellow && currentLevel.holes[0].tees.yellow.rot !== undefined) {
                        car.heading = currentLevel.holes[0].tees.yellow.rot;
                    }
                    if (car.mesh) car.mesh.rotation.y = car.heading;
                    if (window.rallyCamera) window.rallyCamera.init(car);
                    if (window.rallyRespawn) window.rallyRespawn.init(car);
                    console.log('✅ Car spawned at tee:', spawnPos.x.toFixed(1), spawnPos.z.toFixed(1), 'heading:', car.heading.toFixed(2));
                }
            } else {
                setTimeout(waitForTerrainAndStart, 100);
            }
        }
        setTimeout(waitForTerrainAndStart, 200);
    }

    // ── Race Logic ──
    let raceState = window.raceState = {
        started: false,
        timer: 0,
        penalty: 0,
        nextCheckpoint: 0,
        checkpointsHit: [],
        finished: false,
        finalTime: 0,
        dnf: false,
        checkpointMeshes: [],
        gateMeshes: [],
        totalLaps: 1,
        currentLap: 1,
        lapTimes: [],
        lastLapSplit: 0,
        finishArmed: false,
        carSplineIndex: 0,
        primaryRoad: null
    };

    function initRaceVisuals() {
        let rc = window.raceConfig;
        if (!rc) return;
        raceState.totalLaps = rc.laps || 1;
        
        if (rc.roads && rc.start && rc.start.roadId) {
            raceState.primaryRoad = rc.roads.find(r => r.id === rc.start.roadId);
        }
        if (!raceState.primaryRoad && rc.roads && rc.roads.length > 0) {
            raceState.primaryRoad = rc.roads[0];
        }
        
        // Create start gate
        if (rc.start) {
            let g = createRaceGate(rc.start, 'start');
            scene.add(g);
            raceState.gateMeshes.push(g);
        }
        // Create finish gate
        if (rc.finish) {
            let g = createRaceGate(rc.finish, 'finish');
            scene.add(g);
            raceState.gateMeshes.push(g);
        }
        // Create checkpoint rings
        if (rc.checkpoints) {
            rc.checkpoints.forEach(function(cp, i) {
                let ring = new THREE.Mesh(
                    new THREE.TorusGeometry((cp.radius || 10) * 0.5, 0.3, 8, 24),
                    new THREE.MeshLambertMaterial({ color: 0xfacc15, transparent: true, opacity: 0.7 })
                );
                ring.rotation.x = Math.PI / 2;
                let groundY = 0;
                if (typeof window.localGetTerrainAt === 'function') {
                    groundY = window.localGetTerrainAt(cp.x, -cp.z).z;
                }
                ring.position.set(cp.x, groundY + 3, cp.z);
                scene.add(ring);
                raceState.checkpointMeshes.push(ring);
            });
        }
    }
    
    function createRaceGate(pos, type) {
        let gate = new THREE.Group();
        let roadW = (window.raceConfig && window.raceConfig.roadWidth) || 10;
        let halfW = roadW / 2, poleH = 5;
        let poleColor = type === 'start' ? 0x22cc44 : 0xeeeeee;
        let poleMat = new THREE.MeshLambertMaterial({ color: poleColor });
        let poleGeo = new THREE.CylinderGeometry(0.15, 0.15, poleH, 8);
        let left = new THREE.Mesh(poleGeo, poleMat);
        left.position.set(-halfW, poleH/2, 0);
        gate.add(left);
        let right = new THREE.Mesh(poleGeo, poleMat);
        right.position.set(halfW, poleH/2, 0);
        gate.add(right);
        let beamColor = type === 'start' ? 0x22cc44 : 0x111111;
        let beam = new THREE.Mesh(
            new THREE.BoxGeometry(roadW+0.3, 0.5, 0.5),
            new THREE.MeshLambertMaterial({ color: beamColor })
        );
        beam.position.set(0, poleH, 0);
        gate.add(beam);
        
        // Banner (START=green text, FINISH=checkered pattern)
        let bannerCanvas = document.createElement('canvas');
        bannerCanvas.width = 256; bannerCanvas.height = 64;
        let bCtx = bannerCanvas.getContext('2d');
        if (type === 'start') {
            bCtx.fillStyle = '#22cc44';
            bCtx.fillRect(0, 0, 256, 64);
            bCtx.fillStyle = '#fff';
            bCtx.font = 'bold 40px Arial';
            bCtx.textAlign = 'center';
            bCtx.fillText('START', 128, 46);
        } else {
            let sq = 16;
            for (let row = 0; row < 64/sq; row++) {
                for (let col = 0; col < 256/sq; col++) {
                    bCtx.fillStyle = (row + col) % 2 === 0 ? '#fff' : '#111';
                    bCtx.fillRect(col * sq, row * sq, sq, sq);
                }
            }
            bCtx.fillStyle = '#111';
            bCtx.font = 'bold 32px Arial';
            bCtx.textAlign = 'center';
            bCtx.fillText('FINISH', 128, 44);
        }
        let bannerTex = new THREE.CanvasTexture(bannerCanvas);
        let bannerGeo = new THREE.PlaneGeometry(roadW * 0.8, 1.2);
        let bannerFront = new THREE.Mesh(
            bannerGeo,
            new THREE.MeshBasicMaterial({ map: bannerTex, side: THREE.FrontSide })
        );
        bannerFront.position.set(0, poleH - 1.0, 0.02);
        gate.add(bannerFront);
        
        let bannerBack = new THREE.Mesh(
            bannerGeo,
            new THREE.MeshBasicMaterial({ map: bannerTex, side: THREE.FrontSide })
        );
        bannerBack.position.set(0, poleH - 1.0, -0.02);
        bannerBack.rotation.y = Math.PI;
        gate.add(bannerBack);
        
        let groundY = 0;
        if (typeof window.localGetTerrainAt === 'function') {
            groundY = window.localGetTerrainAt(pos.x, -pos.z).z;
        }
        gate.position.set(pos.x, groundY, pos.z);
        // Apply saved rotation
        if (pos.rotation) gate.rotation.y = pos.rotation;
        return gate;
    }

    function createRaceHUD() {
        let ex = document.getElementById('race-hud');
        if (ex) ex.remove();
        let h = document.createElement('div');
        h.id = 'race-hud';
        h.innerHTML =

    function updateRaceLogic(dt) {
        let rc = window.raceConfig;
        if (!rc || !rc.start || !rc.finish) return;
        
        let carPos = null;
        if (window.rallyVehicle && window.rallyVehicle.isActive() && window.rallyVehicle.getCar) {
            carPos = window.rallyVehicle.getCar().position;
        }
        if (!carPos) return;
        
        if (raceState.finished || raceState.dnf) return;
        
        // --- 1. Track Progression (Spline Tracking) ---
        if (raceState.primaryRoad && raceState.primaryRoad.sampledPoints) {
            let pts = raceState.primaryRoad.sampledPoints;
            let minDistSq = Infinity;
            let closestIdx = raceState.carSplineIndex;
            let searchStart = Math.max(0, raceState.carSplineIndex - 50);
            let searchEnd = Math.min(pts.length - 1, raceState.carSplineIndex + 150);
            
            if (raceState.carSplineIndex === 0 && raceState.timer < 1.0) {
                searchStart = 0; searchEnd = pts.length - 1;
            }

            for(let i = searchStart; i <= searchEnd; i++) {
                let p = pts[i];
                let dx = carPos.x - p.x;
                let dz = carPos.z - p.z;
                let distSq = dx*dx + dz*dz;
                if (distSq < minDistSq) { minDistSq = distSq; closestIdx = i; }
            }
            raceState.carSplineIndex = closestIdx;
        }

        // --- 2. Arming Logic (Circuit Support) ---
        if (!raceState.finishArmed) {
            let dxA = carPos.x - rc.start.x;
            let dzA = carPos.z - rc.start.z;
            if (Math.sqrt(dxA*dxA + dzA*dzA) > 40 || raceState.checkpointsHit.length > 0) {
                raceState.finishArmed = true;
                console.log("🏁 Finish Line ARMED!");
            }
        }
        
        // --- 3. Start Detection ---
        if (!raceState.started) {
            let car = window.rallyVehicle.getCar();
            if (car && car.speed && Math.abs(car.speed) > 0.5) {
                raceState.started = true;
                let msg = document.getElementById('race-start-msg');
                if (msg) { msg.style.opacity = '0'; setTimeout(function() { msg.remove(); }, 500); }
            }
            return;
        }
        
        raceState.timer += dt;
        
        // --- 4. Spline-Based Checkpoints ---
        if (rc.checkpoints && raceState.nextCheckpoint < rc.checkpoints.length) {
            let cp = rc.checkpoints[raceState.nextCheckpoint];
            let validY = Math.abs(carPos.y - cp.y) < 8.0;
            
            let passedSpline = cp.splineIndex !== undefined && raceState.carSplineIndex >= cp.splineIndex;
            
            let dx = carPos.x - cp.x, dz = carPos.z - cp.z;
            let dist = Math.sqrt(dx*dx + dz*dz);
            let inRadius = dist < (cp.radius || 10);
            
            if (validY && (inRadius || passedSpline)) {
                raceState.checkpointsHit.push(raceState.nextCheckpoint);
                let ring = raceState.checkpointMeshes[raceState.nextCheckpoint];
                if (ring) {
                    ring.material.color.setHex(0x4ade80);
                    ring.material.opacity = 1.0;
                    setTimeout(function() { ring.material.opacity = 0.3; }, 1000);
                }
                raceState.nextCheckpoint++;
                console.log('📍 Checkpoint ' + raceState.checkpointsHit.length + '/' + rc.checkpoints.length);
            }
        }

        // --- 5. Finish Line (Strict Checks) ---
        if (raceState.finishArmed) {
            let dxF = carPos.x - rc.finish.x, dzF = carPos.z - rc.finish.z;
            let distFinish = Math.sqrt(dxF*dxF + dzF*dzF);
            let validFinishY = Math.abs(carPos.y - rc.finish.y) < 8.0;
            
            if (distFinish < 15 && validFinishY) {
                let carHeading = window.rallyVehicle.getCar().heading;
                let carForward = new THREE.Vector3(Math.sin(carHeading), 0, Math.cos(carHeading));
                let finishForward = new THREE.Vector3(Math.sin(rc.finish.rotation || 0), 0, Math.cos(rc.finish.rotation || 0));
                
                let dot = carForward.x * finishForward.x + carForward.z * finishForward.z;
                
                if (dot > 0) { // Must cross forward
                    let allCPDone = !rc.checkpoints || raceState.nextCheckpoint >= rc.checkpoints.length;
                    
                    if (!allCPDone) {
                        let msg = document.getElementById('race-missed-msg');
                        if (msg) msg.remove();
                        msg = document.createElement('div');
                        msg.id = 'race-missed-msg';
                        msg.innerHTML = '⚠️ MISSADE CHECKPOINTS!<br><span style="font-size:16px;color:#fff">Kör tillbaka och passera alla markörer. Tryck Backspace för att starta om vid förra CP.</span>';
                        msg.style.cssText = 'position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:10000;pointer-events:none;' +
                        'color:#ef4444;font-size:28px;font-weight:900;font-family:\'Inter\',sans-serif;text-shadow:0 0 30px rgba(239,68,68,0.5);text-align:center;transition:opacity 1.5s ease;';
                        document.body.appendChild(msg);
                        setTimeout(() => { if (msg) msg.style.opacity = '0'; setTimeout(() => { if (msg) msg.remove(); }, 1500); }, 2000);
                        return; // Block lap completion or race finish
                    }

                    let currentTotalTime = raceState.timer + raceState.penalty;
                    let lapTime = currentTotalTime - raceState.lastLapSplit;
                    raceState.lapTimes.push(lapTime);
                    raceState.lastLapSplit = currentTotalTime;

                    if (raceState.currentLap < raceState.totalLaps) {
                        raceState.currentLap++;
                        raceState.nextCheckpoint = 0;
                        raceState.checkpointsHit = [];
                        raceState.finishArmed = false;
                        raceState.carSplineIndex = 0;
                        
                        let msg = document.getElementById('race-lap-msg');
                        if (msg) msg.remove();
                        msg = document.createElement('div');
                        msg.id = 'race-lap-msg';
                        let min = Math.floor(lapTime / 60);
                        let sec = Math.floor(lapTime % 60);
                        let dec = Math.floor((lapTime % 1) * 10);
                        let timeStr = min + ':' + String(sec).padStart(2, '0') + '.' + dec;
                        msg.innerHTML = 'VARV ' + (raceState.currentLap - 1) + ' KLART!<br><span style="font-size:20px;color:#fff">' + timeStr + '</span>';
                        msg.style.cssText = 'position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:10000;pointer-events:none;' +
                        'color:#fbbf24;font-size:36px;font-weight:900;font-family:\'Inter\',sans-serif;text-shadow:0 0 30px rgba(251,191,36,0.5);text-align:center;transition:opacity 2s ease;';
                        document.body.appendChild(msg);
                        setTimeout(() => { if (msg) msg.style.opacity = '0'; setTimeout(() => { if (msg) msg.remove(); }, 2000); }, 2000);
                    } else {
                        raceState.finished = true;
                        raceState.finalTime = currentTotalTime;
                        showRaceResult();
                        return;
                    }
                }
            }
        }
        
        // Update HUD
        updateRaceHUD();
    }

    function updateRaceHUD() {
        let te = document.getElementById('race-timer');
        if (te) {
            let t = raceState.timer;
            let min = Math.floor(t / 60);
            let sec = Math.floor(t % 60);
            let dec = Math.floor((t % 1) * 10);
            te.textContent = min + ':' + String(sec).padStart(2, '0') + '.' + dec;
            te.style.color = raceState.started ? '#4ade80' : '#94a3b8';
        }
        let lapEl = document.getElementById('race-lap');
        if (lapEl) {
            lapEl.textContent = raceState.currentLap + '/' + raceState.totalLaps;
        }
        let lastLapEl = document.getElementById('race-lastlap');
        if (lastLapEl && raceState.lapTimes.length > 0) {
            let ll = raceState.lapTimes[raceState.lapTimes.length - 1];
            let min = Math.floor(ll / 60);
            let sec = Math.floor(ll % 60);
            let dec = Math.floor((ll % 1) * 10);
            lastLapEl.textContent = 'Last: ' + min + ':' + String(sec).padStart(2, '0') + '.' + dec;
        }
        let cp = document.getElementById('race-cp');
        let rc = window.raceConfig;
        if (cp && rc) {
            let total = rc.checkpoints ? rc.checkpoints.length : 0;
            cp.textContent = raceState.checkpointsHit.length + '/' + total;
        }
        let pe = document.getElementById('race-penalty');
        if (pe) {
            pe.textContent = '+' + raceState.penalty + 's';
            pe.style.color = raceState.penalty > 0 ? '#ef4444' : '#64748b';
        }
    }

    function showRaceResult() {
        let ex = document.getElementById('race-result');
        if (ex) ex.remove();
        let d = document.createElement('div');
        d.id = 'race-result';
        d.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10001;' +
            'background:rgba(15,23,42,0.96);border:2px solid #4ade80;border-radius:20px;padding:30px 40px;' +
            'text-align:center;font-family:\'Inter\',\'Segoe UI\',sans-serif;backdrop-filter:blur(16px);min-width:280px;';
        
        if (raceState.dnf) {
            d.innerHTML = '<div style="font-size:48px;font-weight:900;color:#ef4444">DNF</div>' +
                '<div style="color:#94a3b8;font-size:14px;margin-top:8px">Missade checkpoints — diskvalificerad</div>' +
                '<button onclick="location.reload()" style="margin-top:16px;background:#ef4444;color:#fff;border:none;padding:12px 28px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer">↻ Försök igen</button>';
        } else {
            let t = raceState.finalTime;
            let min = Math.floor(t / 60);
            let sec = Math.floor(t % 60);
            let dec = Math.floor((t % 1) * 10);
            let timeStr = min + ':' + String(sec).padStart(2, '0') + '.' + dec;
            let penStr = raceState.penalty > 0 ? '<div style="color:#ef4444;font-size:14px;margin-top:4px">Penalty: +' + raceState.penalty + 's</div>' : '';
            
            let lapsHtml = '';
            if (raceState.lapTimes.length > 1) {
                lapsHtml = '<div style="margin-top:12px;background:rgba(0,0,0,0.3);padding:8px;border-radius:8px;font-size:12px;color:#cbd5e1;text-align:left;max-height:100px;overflow-y:auto;">';
                raceState.lapTimes.forEach((lt, i) => {
                    let lm = Math.floor(lt / 60);
                    let ls = Math.floor(lt % 60);
                    let ld = Math.floor((lt % 1) * 10);
                    lapsHtml += '<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span>Varv ' + (i+1) + ':</span><span style="font-family:monospace">' + lm + ':' + String(ls).padStart(2, '0') + '.' + ld + '</span></div>';
                });
                lapsHtml += '</div>';
            }
            
            let level = ArcadeStorage.loadCustomLevel() || ArcadeStorage.loadCompressedLevel();
            let courseCode = (level && level.share_code) ? level.share_code : null;
            let statusHtml = '<div id="submit-status" style="font-size:11px;color:#94a3b8;margin-top:8px">Leaderboard check...</div>';
            
            if (courseCode) {
                let deciseconds = Math.round(t * 10);
                let playerName = 'Driver';
                if (window.GolfAuth && window.GolfAuth.displayName) playerName = window.GolfAuth.displayName;
                else if (localStorage.getItem('golf_os_username')) playerName = localStorage.getItem('golf_os_username');
                
                let vehicleType = 'Rally Car';
                if (window.rallyVehicle && typeof window.rallyVehicle.getType === 'function') {
                    vehicleType = window.rallyVehicle.getType();
                }
                
                let resultPayload = {
                    total_score: deciseconds,
                    score_vs_par: 0,
                    hole_scores: raceState.lapTimes.map(lt => Math.round(lt * 10)),
                    input_mode: 'RALLY_DRIVE',
                    lm_device: vehicleType,
                    stats: { finalTime: t, lapTimes: raceState.lapTimes, vehicle: vehicleType, penalty: raceState.penalty },
                    player_name: playerName
                };
                
                ArcadeAPI.submitResult(courseCode, resultPayload).then(data => {
                    let statusEl = document.getElementById('submit-status');
                    if (statusEl) {
                        if (data && data.success) {
                            statusEl.style.color = '#4ade80';
                            statusEl.innerHTML = '🏆 Leaderboard Position: <strong>#' + data.position + '</strong>';
                        } else {
                            statusEl.style.color = '#eab308';
                            statusEl.innerText = 'Time recorded';
                        }
                    }
                }).catch(err => {
                    let statusEl = document.getElementById('submit-status');
                    if (statusEl) {
                        statusEl.style.color = '#94a3b8';
                        statusEl.innerText = 'Time saved locally';
                    }
                });
            } else {
                statusHtml = '<div style="font-size:11px;color:#94a3b8;margin-top:8px">Built-in Preset Raced</div>';
            }

            d.innerHTML = '<div style="font-size:22px;font-weight:700;color:#4ade80;text-transform:uppercase;letter-spacing:2px">🏁 FINISHED</div>' +
                '<div style="font-size:56px;font-weight:900;color:#fff;letter-spacing:-2px;margin:8px 0;line-height:1">' + timeStr + '</div>' +
                penStr + lapsHtml +
                statusHtml +
                '<button onclick="location.reload()" style="margin-top:16px;background:#4ade80;color:#0f172a;border:none;padding:12px 28px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer">↻ Kör igen</button>';
        }
        document.body.appendChild(d);
    }

    // Init race visuals if raceConfig loaded
    if (window.raceConfig && window.raceConfig.start) {
        initRaceVisuals();
        createRaceHUD();
        updateRaceHUD();
    }

    // ── Animate Loop ──
    let lastAnimTime = 0;
    function animate(now) {
        requestAnimationFrame(animate);
        let dt = lastAnimTime ? (now - lastAnimTime) / 1000 : 0.016;
        lastAnimTime = now;
        dt = Math.min(dt, 0.05);

        if (window.rallyHelicopter && window.rallyHelicopter.isActive()) {
            window.rallyHelicopter.update(camera);
        } else if (window.rallyVehicle && window.rallyVehicle.isActive()) {
            window.rallyVehicle.update(camera, controls);
            // Race logic runs alongside car physics
            if (window.raceConfig && window.raceConfig.start) {
                updateRaceLogic(dt);
            }
        } else {
            controls.update();
        }

        renderer.render(scene, camera);
    }
    animate(0);

    // ── Resize ──
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Vehicle Switch (H key) + ESC to hub ──
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            window.location.href = 'rally_hub.html';
        }
        if (e.key === 'h' || e.key === 'H') {
            if (window.rallyVehicle && window.rallyVehicle.isActive()) {
                // Switch: Car → Helicopter
                let carPos = window.rallyVehicle.getCar().position.clone();
                window.rallyVehicle.deactivate(scene);
                // Hide car HUD
                let rh = document.getElementById('rally-hud'); if (rh) rh.style.display = 'none';
                window.rallyHelicopter.activate(scene, camera);
                // Spawn heli at car position
                let heliObj = window.rallyHelicopter.getHeli();
                if (heliObj && heliObj.position) {
                    let groundY = 0;
                    if (typeof window.localGetTerrainAt === 'function') {
                        groundY = window.localGetTerrainAt(carPos.x, -carPos.z).z;
                    }
                    heliObj.position.set(carPos.x, groundY + 1.3, carPos.z);
                }
            } else if (window.rallyHelicopter && window.rallyHelicopter.isActive()) {
                // Switch: Helicopter → Car
                let heliPos = window.rallyHelicopter.getPosition().clone();
                window.rallyHelicopter.deactivate(scene);
                controls.enabled = false;
                window.rallyVehicle.activate(scene, camera, controls);
                // Spawn car at heli position (on ground)
                let car = window.rallyVehicle.getCar();
                if (car) {
                    let groundY = 0;
                    if (typeof window.localGetTerrainAt === 'function') {
                        groundY = window.localGetTerrainAt(heliPos.x, -heliPos.z).z;
                    }
                    car.position.set(heliPos.x, groundY + 0.35 + 1.5, heliPos.z);
                    car._spawnPosition = car.position.clone();
                    if (car.mesh) car.mesh.position.copy(car.position);
                    if (window.rallyRespawn) window.rallyRespawn.init(car);
                }
            }
        }
    });

})();
</script>

</body>
</html>
